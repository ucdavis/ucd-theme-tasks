name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum from engines.node, and the current LTS from .nvmrc.
        node-version: ['22.17.0', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # package-lock.json is gitignored, so `npm ci` can't be used.
      - run: npm install
      - run: npm test
